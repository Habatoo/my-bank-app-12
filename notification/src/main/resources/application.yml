spring:
  application:
    name: notification

  r2dbc:
    url: r2dbc:postgresql://${DB_NOTIFICATION_HOST:localhost}:${DB_NOTIFICATION_PORT:5432}/${DB_NOTIFICATION_NAME:notification_db}
    username: ${DB_USER_NAME:bank_admin}
    password: ${DB_PASSWORD:bank_password}
    pool:
      enabled: true
      initial-size: 10
      max-size: 50

  datasource:
    url: jdbc:postgresql://${DB_NOTIFICATION_HOST:localhost}:${DB_NOTIFICATION_PORT:5432}/${DB_NOTIFICATION_NAME:notification_db}
    username: ${DB_USER_NAME:bank_admin}
    password: ${DB_PASSWORD:bank_password}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/notification/db.changelog-master.yaml
    default-schema: ${DB_SCHEMA:public}
    url: jdbc:postgresql://${DB_NOTIFICATION_HOST:localhost}:${DB_NOTIFICATION_PORT:5432}/${DB_NOTIFICATION_NAME:notification_db}
    user: ${DB_USER_NAME:bank_admin}
    password: ${DB_PASSWORD:bank_password}
    contexts: dev,test,default

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus,metrics
      base-path: /actuator
  metrics:
    enable:
      all: true
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    prometheus:
      access: unrestricted
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411}/api/v2/spans
  tracing:
    sampling:
      probability: 1