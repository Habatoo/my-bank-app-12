global:
  db:
    user: "bank_admin"
    port: "5432"
  keycloak:
    url: "http://keycloak"
    port: "8080"
    realm: "bank"
  gateway:
    host: "http://gateway:8080"
  kafka:
    bootstrapServers: "kafka:9092"
    resilienceTopic: "system-alerts"
  security:
    allowInsecureImages: true

account-db:
  postgres:
    db: account_db
    user: bank_admin
    password: bank_password
  persistence:
    size: 1Gi
    enabled: true

cash-db:
  postgres:
    db: cash_db
    user: bank_admin
    password: bank_password
  persistence:
    size: 1Gi
    enabled: true

notification-db:
  postgres:
    db: notification_db
    user: bank_admin
    password: bank_password
  persistence:
    size: 1Gi
    enabled: true

transfer-db:
  postgres:
    db: transfer_db
    user: bank_admin
    password: bank_password
  persistence:
    size: 1Gi
    enabled: true

zipkin:
  fullnameOverride: zipkin
  service:
    type: ClusterIP
    port: 9411

  persistence:
    enabled: false

  storage:
    type: mem

  cassandra:
    enabled: false

  image:
    registry: docker.io
    repository: openzipkin/zipkin
    tag: "2.24.1"

keycloak:
  service:
    type: ClusterIP
    ports:
      http: 80
    targetPort: 8080

  postgresql:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: "17.6.0-debian-12-r4"

  image:
    registry: docker.io
    repository: bitnamilegacy/keycloak
    tag: "26.3.3"

  fullnameOverride: keycloak

  auth:
    adminUser: admin
    adminPassword: admin

  extraEnvVars:
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      value: "admin"
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      value: "admin"
    - name: KEYCLOAK_LOG_LEVEL
      value: "DEBUG"
    - name: KC_HEALTH_ENABLED
      value: "true"
    - name: KC_METRICS_ENABLED
      value: "true"
    - name: KC_HTTP_ENABLED
      value: "true"
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_HOSTNAME_STRICT_HTTPS
      value: "false"
    - name: KC_HOSTNAME_STRICT_BACKCHANNEL
      value: "false"
    - name: KC_PROXY_HEADERS
      value: "xforwarded"
    - name: KC_HOSTNAME
      value: "keycloak"
    - name: KC_IMPORT_STRATEGY
      value: "OVERWRITE_EXISTING"
    - name: KEYCLOAK_EXTRA_ARGS
      value: "--import-realm"
    - name: KC_HTTP_MANAGEMENT_PORT
      value: "9000"

  extraVolumes:
    - name: realm-import-raw
      configMap:
        name: keycloak-import
    - name: realm-import-writable
      emptyDir: { }
    - name: custom-theme-source
      configMap:
        name: keycloak-theme

  extraVolumeMounts:
    - name: realm-import-writable
      mountPath: /opt/bitnami/keycloak/data/import
    - name: custom-theme-source
      mountPath: /opt/bitnami/keycloak/themes/bank-theme/login/login.ftl
      subPath: login.ftl
    - name: custom-theme-source
      mountPath: /opt/bitnami/keycloak/themes/bank-theme/login/register.ftl
      subPath: register.ftl
    - name: custom-theme-source
      mountPath: /opt/bitnami/keycloak/themes/bank-theme/login/theme.properties
      subPath: theme.properties
    - name: custom-theme-source
      mountPath: /opt/bitnami/keycloak/themes/bank-theme/login/resources/css/style.css
      subPath: style.css

  initContainers:
    - name: prepare-realm
      image: busybox:1.36
      command: [ "/bin/sh", "-c" ]
      args:
        - |
          set -e
          echo "Copying realm files..."
          cp -v /cm/*.json /opt/bitnami/keycloak/data/import/ || echo "No json found"
      volumeMounts:
        - name: realm-import-raw
          mountPath: /cm
        - name: realm-import-writable
          mountPath: /opt/bitnami/keycloak/data/import

  persistence:
    deployPostgresql: true

kafka:
  fullnameOverride: "kafka"
  podSecurityContext:
    enabled: false
  containerSecurityContext:
    enabled: false

  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: "4.0.0-debian-12-r10"

  kraft:
    enabled: true
    clusterId: "r4L9u9s8ST67S869S1GvEA"

  controller:
    replicaCount: 1

  broker:
    replicaCount: 1
    persistence:
      enabled: true
      size: 2Gi

  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT

  provisioning:
    enabled: false

  sasl:
    enabled: false
  rbac:
    create: false

monitoring:
  enabled: true
  fullnameOverride: monitoring

  grafana:
    enabled: true
    additionalDataSources:
      - name: Elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch-master:9200
        jsonData:
          timeField: "@timestamp"
          esVersion: 8
          index: "my-bank-logs-*"
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "my-bank"
          orgId: 1
          folder: "My Bank"
          type: file
          options:
            path: /var/lib/grafana/dashboards/my-bank
    dashboards:
      my-bank:
        my-bank-business:
          file: files/grafana-dashboards/my-bank-business.json
    adminUser: admin
    adminPassword: admin

    service:
      type: ClusterIP

  kubeStateMetrics:
    enabled: false

  nodeExporter:
    enabled: false

  alertmanager:
    enabled: false

  prometheus:
    enabled: true
    prometheusSpec:
      resources:
        requests:
          memory: 800Mi
        limits:
          memory: 1Gi

elasticsearch:
  enabled: true
  replicas: 1

  esJavaOpts: "-Xmx512m -Xms512m"

  resources:
    requests:
      cpu: 200m
      memory: 700Mi
    limits:
      cpu: 500m
      memory: 1Gi

  persistence:
    enabled: false

  minimumMasterNodes: 1

  service:
    type: ClusterIP

logstash:
  enabled: true
  service:
    type: ClusterIP

  logstashPipeline:
    logstash.conf: |
      input {
        tcp {
          port => 5000
          codec => json
        }
      }

      filter {
        date {
          match => ["@timestamp", "ISO8601"]
        }
      }

      output {
        elasticsearch {
          hosts => ["http://elasticsearch-master:9200"]
          index => "my-bank-logs-%{+YYYY.MM.dd}"
        }
      }

  serviceAccount:
    create: false

kibana:
  enabled: true
  initContainers: [ ]
  extraEnvs: [ ]
  preInstallJob:
    enabled: false
  readinessProbe:
    enabled: false
  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 2Gi

  elasticsearchHosts: "http://elasticsearch-master:9200"