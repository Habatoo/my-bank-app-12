apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: my-bank-services
  namespace: dev
  labels:
    release: bank-dev
spec:
  namespaceSelector:
    matchNames:
      - dev
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - front-ui
          - gateway
          - account
          - cash
          - transfer
          - notification
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s