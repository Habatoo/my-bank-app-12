apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace | default "dev" }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ default "latest" .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
              - containerPort: 8080
          envFrom:
            - configMapRef:
                name: bank-common-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-bank-common-secrets
                  key: DB_PASSWORD
            - name: DB_NOTIFICATION_HOST
              value: "bank-dev-notification-db"
            - name: DB_NOTIFICATION_NAME
              value: "notification_db"
            - name: KEYCLOAK_NOTIFICATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: my-bank-common-secrets
                  key: KEYCLOAK_NOTIFICATION_SECRET
            - name: KEYCLOAK_HOST
              value: "keycloak"
            - name: KEYCLOAK_PORT
              value: "8080"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://keycloak/realms/bank"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI
              value: "http://keycloak/realms/bank"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.global.kafka.bootstrapServers | quote }}
            - name: KAFKA_RESILIENCE_TOPIC
              value: {{ .Values.global.kafka.resilienceTopic | quote }}
            - name: KAFKA_ACCOUNT_TOPIC
              value: "account-notifications"
            - name: KAFKA_CASH_TOPIC
              value: "cash-notifications"
            - name: KAFKA_TRANSFER_TOPIC
              value: "transfer-notifications"
            - name: SPRING_APPLICATION_NAME
              value: {{ .Chart.Name | quote }}
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"