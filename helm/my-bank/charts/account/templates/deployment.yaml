apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace | default "dev" }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ default "latest" .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
              - containerPort: 8080
          envFrom:
            - configMapRef:
                name: bank-common-config
            - secretRef:
                name: my-bank-common-secrets
          env:
            - name: CHASSIS_OUTBOX_ENABLED
              value: "true"
            - name: CHASSIS_KAFKA_ENABLED
              value: "true"
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              value: "account-group"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-bank-common-secrets
                  key: DB_PASSWORD
            - name: DB_ACCOUNT_HOST
              value: "bank-dev-account-db"
            - name: DB_ACCOUNT_NAME
              value: "account_db"
            - name: KEYCLOAK_ACCOUNT_SECRET
              valueFrom:
                secretKeyRef:
                  name: my-bank-common-secrets
                  key: KEYCLOAK_ACCOUNT_SECRET
            - name: KEYCLOAK_HOST
              value: "keycloak"
            - name: KEYCLOAK_PORT
              value: "8080"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://keycloak/realms/bank"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI
              value: "http://keycloak/realms/bank"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.global.kafka.bootstrapServers | quote }}
            - name: KAFKA_TOPIC
              value: "account-notifications"
            - name: KAFKA_RESILIENCE_TOPIC
              value: {{ .Values.global.kafka.resilienceTopic | quote }}